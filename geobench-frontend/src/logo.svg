<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Matches App Dark Theme) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a221a" />
      <stop offset="100%" stop-color="#16120e" />
    </linearGradient>

    <!-- Waveform Gradient (Matches Blue to Red/Orange App Colors) -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#348abd" />
      <stop offset="35%" stop-color="#348abd" />
      <stop offset="50%" stop-color="#d9604a" />
      <stop offset="65%" stop-color="#d9604a" />
      <stop offset="100%" stop-color="#348abd" />
    </linearGradient>

    <!-- Spectrogram Heatmap Gradient (Magma) -->
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000004" />
      <stop offset="25%" stop-color="#51127c" />
      <stop offset="45%" stop-color="#b63679" />
      <stop offset="50%" stop-color="#fc8961" />
      <stop offset="55%" stop-color="#b63679" />
      <stop offset="75%" stop-color="#51127c" />
      <stop offset="100%" stop-color="#000004" />
    </linearGradient>
  </defs>

  <!-- Base Icon Shape -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="232" height="232" rx="44" fill="none" stroke="#372c20" stroke-width="4" />

  <!-- Subdued Grid Lines (Time & Frequency Axes) -->
  <g stroke="#372c20" stroke-width="2" stroke-dasharray="6 6" opacity="0.4">
    <line x1="64" y1="12" x2="64" y2="244" />
    <line x1="128" y1="12" x2="128" y2="244" />
    <line x1="192" y1="12" x2="192" y2="244" />
    <line x1="12" y1="64" x2="244" y2="64" />
    <line x1="12" y1="128" x2="244" y2="128" />
    <line x1="12" y1="192" x2="244" y2="192" />
  </g>

  <!-- Anomaly Threshold Limit Line -->
  <line x1="24" y1="72" x2="232" y2="72" stroke="#9c9080" stroke-width="4" stroke-dasharray="8 8" opacity="0.7" />

  <!-- Spectrogram Representation (Bottom Panel) -->
  <rect x="24" y="200" width="208" height="24" rx="8" fill="url(#specGrad)" />
  <rect x="112" y="200" width="32" height="24" rx="6" fill="#fcfba1" opacity="0.9" />

  <!-- Continuous Seismic Waveform -->
  <path d="M 24 136
           L 72 136
           L 84 116
           L 96 156
           L 108 126
           L 116 146
           L 128 48
           L 140 196
           L 152 116
           L 164 146
           L 176 126
           L 188 136
           L 232 136"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="12"
        stroke-linejoin="round"
        stroke-linecap="round" />

  <!-- Detected Event Peak Marker -->
  <circle cx="128" cy="48" r="10" fill="#f1c40f" />
</svg>
